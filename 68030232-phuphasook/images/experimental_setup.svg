<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" style="background: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
  </defs>

  <text x="440" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">การจัดวางอุปกรณ์ทดสอบเพื่อทำ Calibration ระหว่าง LDR กับ Smartphone Lux Meter</text>

  <!-- Desk Light Source (Top Center) -->
  <g transform="translate(440, 50)">
    <!-- Lamp bulb -->
    <path d="M -30 0 L 30 0 L 20 25 L -20 25 Z" fill="#475569"/>
    <circle cx="0" cy="30" r="16" fill="#fef08a" stroke="#eab308" stroke-width="2"/>
    <!-- Light rays spreading downwards -->
    <path d="M -25 45 L -140 160 M 0 50 L 0 160 M 25 45 L 140 160" stroke="#facc15" stroke-width="2" stroke-dasharray="4,4"/>
    <text x="0" y="-8" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">แหล่งกำเนิดแสงที่ควบคุมระดับความสว่างได้ (Variable Light Source)</text>
  </g>

  <!-- Left: Development Laptop (Serial Monitor) -->
  <g transform="translate(40, 160)">
    <rect width="230" height="220" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="15" y="15" width="200" height="130" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    
    <!-- Code/Serial simulation on laptop screen -->
    <text x="25" y="35" font-size="9" font-family="monospace" fill="#38bdf8">&gt; ESP-IDF Monitor (COM4)</text>
    <text x="25" y="55" font-size="9" font-family="monospace" fill="#4ade80">ADC Raw: 1550 | 1248 mV</text>
    <text x="25" y="70" font-size="9" font-family="monospace" fill="#facc15">Calculated: 219.8 Lux</text>
    <text x="25" y="90" font-size="9" font-family="monospace" fill="#4ade80">ADC Raw: 2100 | 1692 mV</text>
    <text x="25" y="105" font-size="9" font-family="monospace" fill="#facc15">Calculated: 379.2 Lux</text>
    
    <!-- Laptop Base -->
    <polygon points="5,150 225,150 215,165 15,165" fill="#94a3b8"/>
    <text x="115" y="195" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">คอมพิวเตอร์ประมวลผล</text>
    <text x="115" y="210" text-anchor="middle" font-size="10" fill="#64748b">บันทึกค่า ADC Raw ผ่าน Serial Monitor</text>
  </g>

  <!-- USB Connection Wire -->
  <path d="M 245 280 C 270 280, 270 280, 295 280" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <text x="270" y="270" text-anchor="middle" font-size="10" fill="#64748b">USB Data Cable</text>

  <!-- Middle: Breadboard with ESP32 & LDR -->
  <g transform="translate(300, 160)">
    <rect width="280" height="220" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#cardShadow)"/>
    
    <!-- Breadboard representation -->
    <rect x="15" y="25" width="250" height="135" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    
    <!-- ESP32 Module -->
    <rect x="25" y="40" width="100" height="85" rx="4" fill="#1e293b"/>
    <text x="75" y="85" text-anchor="middle" font-size="10" font-weight="bold" fill="#38bdf8">ESP32 Dev</text>

    <!-- Resistor 10k -->
    <rect x="170" y="80" width="15" height="40" rx="3" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5"/>
    <text x="210" y="105" font-size="9" font-weight="bold" fill="#c2410c">10 kΩ</text>

    <!-- LDR Component (Upward facing) -->
    <circle cx="178" cy="48" r="14" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
    <path d="M 170 45 Q 178 40 186 45 Q 178 50 170 45" fill="none" stroke="#dc2626" stroke-width="1.5"/>
    <text x="178" y="28" text-anchor="middle" font-size="11" font-weight="bold" fill="#854d0e">LDR Sensor</text>

    <!-- Jumper wires -->
    <path d="M 125 55 Q 145 40 165 48" fill="none" stroke="#ef4444" stroke-width="2"/>
    <path d="M 125 75 Q 145 65 178 62" fill="none" stroke="#3b82f6" stroke-width="2"/>
    <path d="M 178 120 Q 155 130 125 105" fill="none" stroke="#64748b" stroke-width="2"/>

    <text x="140" y="185" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">บอร์ดทดลอง (Breadboard)</text>
    <text x="140" y="202" text-anchor="middle" font-size="10" fill="#64748b">วงจรแบ่งแรงดัน LDR + R 10k ต่อเข้า GPIO34</text>
  </g>

  <!-- Right: Reference Smartphone with Lux Meter App -->
  <g transform="translate(615, 160)">
    <rect width="225" height="220" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#cardShadow)"/>

    <!-- Smartphone Body -->
    <rect x="52" y="15" width="120" height="150" rx="14" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
    <rect x="58" y="25" width="108" height="130" rx="8" fill="#0284c7"/>
    
    <!-- Phone Screen (Lux Meter App) -->
    <text x="112" y="55" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">LUX METER</text>
    <circle cx="112" cy="85" r="24" fill="#ffffff" fill-opacity="0.2"/>
    <text x="112" y="89" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">380</text>
    <text x="112" y="104" text-anchor="middle" font-size="10" fill="#e0f2fe">LUX</text>
    <text x="112" y="135" text-anchor="middle" font-size="8" fill="#bae6fd">Ground Truth Sensor</text>

    <!-- Ambient Light Sensor indicator at top of phone -->
    <circle cx="95" cy="20" r="2.5" fill="#38bdf8"/>
    <text x="112" y="12" text-anchor="middle" font-size="9" font-weight="bold" fill="#0284c7">Sensor รับแสงมือถือ</text>

    <text x="112" y="185" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">เครื่องมือวัดอ้างอิง</text>
    <text x="112" y="202" text-anchor="middle" font-size="10" fill="#64748b">Smartphone Lux Meter (วางระนาบเดียวกับ LDR)</text>
  </g>

  <!-- Alignment Indicator Line between Phone and LDR -->
  <line x1="478" y1="208" x2="667" y2="180" stroke="#059669" stroke-width="2" stroke-dasharray="4,3"/>
  <circle cx="478" cy="208" r="4" fill="#059669"/>
  <circle cx="667" cy="180" r="4" fill="#059669"/>
  <rect x="510" y="160" width="130" height="24" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="575" y="176" text-anchor="middle" font-size="10" font-weight="bold" fill="#166534">วางในระนาบและมุมเดียวกัน</text>
</svg>