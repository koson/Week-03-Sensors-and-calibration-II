<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" style="background: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="boxShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
  </defs>

  <text x="440" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">แผนภาพวงจรแบ่งแรงดัน (Voltage Divider) ร่วมกับ ESP32 และวงจรกรองสัญญาณ</text>

  <!-- ESP32 Board Illustration (Left) -->
  <g transform="translate(40, 60)">
    <rect width="260" height="300" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2" filter="url(#boxShadow)"/>
    <!-- Board header -->
    <rect x="0" y="0" width="260" height="45" rx="12" fill="#0f172a"/>
    <text x="130" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#38bdf8">ESP32 Dev Module</text>
    
    <!-- SoC chip representation -->
    <rect x="65" y="75" width="130" height="110" rx="6" fill="#334155" stroke="#475569" stroke-width="1.5"/>
    <text x="130" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#94a3b8">ESP32-WROOM</text>
    <text x="130" y="145" text-anchor="middle" font-size="10" fill="#64748b">12-bit SAR ADC</text>

    <!-- Pins on Right Edge of ESP32 -->
    <!-- 3.3V Pin -->
    <circle cx="245" cy="80" r="7" fill="#ef4444"/>
    <text x="225" y="85" text-anchor="end" font-size="12" font-weight="bold" fill="#f87171">3.3V (Vcc)</text>

    <!-- GPIO 34 Pin -->
    <circle cx="245" cy="180" r="7" fill="#3b82f6"/>
    <text x="225" y="185" text-anchor="end" font-size="12" font-weight="bold" fill="#60a5fa">GPIO 34 (ADC1_CH6)</text>

    <!-- GND Pin -->
    <circle cx="245" cy="270" r="7" fill="#64748b"/>
    <text x="225" y="275" text-anchor="end" font-size="12" font-weight="bold" fill="#94a3b8">GND</text>
  </g>

  <!-- Wiring and Circuit Components (Right) -->
  <g transform="translate(340, 60)">
    <rect width="500" height="300" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#boxShadow)"/>
    <text x="250" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">วงจรแบ่งแรงดัน (Voltage Divider Circuit)</text>

    <!-- Power Line (Red) -->
    <path d="M -55 80 L 120 80 L 120 100" fill="none" stroke="#ef4444" stroke-width="3"/>
    <text x="40" y="70" font-size="11" font-weight="bold" fill="#dc2626">+3.3V Power Rail</text>

    <!-- Component 1: LDR -->
    <g transform="translate(85, 100)">
      <rect x="0" y="0" width="70" height="45" rx="6" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
      <path d="M 15 22 Q 35 12 55 22 Q 35 32 15 22" fill="none" stroke="#dc2626" stroke-width="2.5"/>
      <text x="35" y="60" text-anchor="middle" font-size="11" font-weight="bold" fill="#854d0e">LDR (R_LDR)</text>
      <!-- Light arrows incident on LDR -->
      <path d="M -15 8 L 0 20 M -20 18 L -5 30" stroke="#eab308" stroke-width="2.5" stroke-linecap="round"/>
      <text x="-40" y="12" font-size="10" font-weight="bold" fill="#ca8a04">Light</text>
    </g>

    <!-- Connection node between LDR and Resistor -->
    <line x1="120" y1="145" x2="120" y2="180" stroke="#334155" stroke-width="3"/>
    <circle cx="120" cy="180" r="6" fill="#2563eb"/>

    <!-- Wire to ESP32 GPIO 34 (Blue) -->
    <path d="M 120 180 L -55 180" fill="none" stroke="#2563eb" stroke-width="3"/>
    <text x="20" y="172" font-size="11" font-weight="bold" fill="#1d4ed8">Analog Signal V_out</text>

    <!-- Filter Capacitor 0.1uF to GND (Noise reduction) -->
    <line x1="120" y1="180" x2="220" y2="180" stroke="#334155" stroke-width="2"/>
    <line x1="220" y1="180" x2="220" y2="200" stroke="#334155" stroke-width="2"/>
    <!-- Capacitor Symbol -->
    <line x1="205" y1="200" x2="235" y2="200" stroke="#334155" stroke-width="3"/>
    <line x1="205" y1="208" x2="235" y2="208" stroke="#334155" stroke-width="3"/>
    <line x1="220" y1="208" x2="220" y2="270" stroke="#334155" stroke-width="2"/>
    <text x="245" y="208" font-size="10" font-weight="bold" fill="#0284c7">C = 0.1 µF</text>
    <text x="245" y="222" font-size="9" fill="#64748b">(Noise Filter)</text>

    <!-- Component 2: Fixed Resistor 10k -->
    <line x1="120" y1="180" x2="120" y2="200" stroke="#334155" stroke-width="3"/>
    <g transform="translate(100, 200)">
      <rect x="0" y="0" width="40" height="50" rx="4" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
      <line x1="5" y1="12" x2="35" y2="12" stroke="#9a3412" stroke-width="2"/>
      <line x1="5" y1="25" x2="35" y2="25" stroke="#1e293b" stroke-width="2"/>
      <line x1="5" y1="38" x2="35" y2="38" stroke="#ea580c" stroke-width="2"/>
      <text x="50" y="28" font-size="11" font-weight="bold" fill="#c2410c">R_fixed = 10 kΩ</text>
    </g>

    <!-- Ground Line (Black) -->
    <line x1="120" y1="250" x2="120" y2="270" stroke="#334155" stroke-width="3"/>
    <line x1="120" y1="270" x2="220" y2="270" stroke="#334155" stroke-width="2"/>
    <path d="M 120 270 L -55 270" fill="none" stroke="#64748b" stroke-width="3"/>
    
    <!-- Ground symbols -->
    <line x1="105" y1="270" x2="135" y2="270" stroke="#334155" stroke-width="3"/>
    <line x1="110" y1="276" x2="130" y2="276" stroke="#334155" stroke-width="2"/>
    <line x1="115" y1="282" x2="125" y2="282" stroke="#334155" stroke-width="1.5"/>
    <text x="75" y="292" font-size="11" font-weight="bold" fill="#475569">GND (0V)</text>

    <!-- Formula Box -->
    <rect x="300" y="80" width="180" height="90" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="390" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">สมการแรงดันเอาต์พุต</text>
    <text x="390" y="130" text-anchor="middle" font-size="12" font-weight="600" fill="#2563eb">V_out = V_cc · </text>
    <text x="390" y="148" text-anchor="middle" font-size="11" fill="#1e3a8a">R_fixed / (R_LDR + R_fixed)</text>
    <text x="390" y="162" text-anchor="middle" font-size="9" fill="#64748b">เมื่อแสงมาก → R_LDR ลด → V_out สูง</text>
  </g>
</svg>